<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>החתונה שלנו</title>
<meta name="theme-color" content="#2E5E4C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="החתונה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Suez+One&display=swap">
<style>
/* Layout: sticky header with couple name + countdown and tab rail; one working pane below. Olive-grove green with a gold accent for money. */
:root{
  --bg:#F2F4EF;--surface:#FFFFFF;--surface-2:#F8F9F6;--ink:#1D2621;--muted:#5C6A62;--line:#DCE2DA;
  --accent:#2E5E4C;--accent-ink:#FFFFFF;--accent-soft:#E1EBE5;
  --gold:#94701F;--gold-soft:#F4ECD9;
  --ok:#2F7A4E;--ok-soft:#E1F0E6;--warn:#9A5F0C;--warn-soft:#F8ECD6;--bad:#B03224;--bad-soft:#F8E3E0;
  --display:"Suez One","Frank Ruhl Libre",Georgia,serif;
  --body:"Heebo","Rubik",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111613;--surface:#19201C;--surface-2:#151B18;--ink:#E6ECE7;--muted:#9AA8A0;--line:#2B3530;
  --accent:#86BDA5;--accent-ink:#0F1A15;--accent-soft:#1F2F28;
  --gold:#D8B566;--gold-soft:#2C2618;
  --ok:#7CC79A;--ok-soft:#1A2C21;--warn:#E5AE5A;--warn-soft:#2E2414;--bad:#F08A7E;--bad-soft:#331C19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613;--surface:#19201C;--surface-2:#151B18;--ink:#E6ECE7;--muted:#9AA8A0;--line:#2B3530;
  --accent:#86BDA5;--accent-ink:#0F1A15;--accent-soft:#1F2F28;
  --gold:#D8B566;--gold-soft:#2C2618;
  --ok:#7CC79A;--ok-soft:#1A2C21;--warn:#E5AE5A;--warn-soft:#2E2414;--bad:#F08A7E;--bad-soft:#331C19;
  color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{flex:1;min-width:0}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.iconbtn svg{width:22px;height:22px}
.drawer{position:fixed;inset:0;z-index:30}
.drawer-bg{position:absolute;inset:0;background:rgba(10,15,12,.45);animation:fadeIn .18s ease-out}
.drawer-card{position:absolute;top:0;bottom:0;right:0;width:min(300px,84vw);background:var(--surface);border-left:1px solid var(--line);padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:2px;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.18);animation:slideIn .2s ease-out}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.drawer-head b{font-family:var(--display);font-weight:400;font-size:1.3rem}
.dlink{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:right;padding:13px 14px;border:0;border-radius:10px;background:none;font:inherit;font-size:1.05rem;color:var(--ink);cursor:pointer}
.dlink:hover{background:var(--surface-2)}
.dlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.dlink .cnt{font-size:.85rem;color:var(--muted);font-weight:500}
.drawer-foot{margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.brand h1{font-family:var(--display);font-weight:400;font-size:1.65rem;line-height:1.15;margin:0;text-wrap:balance}
.brand .sub{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.brand .sub b{color:var(--gold);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent;margin-inline-start:auto}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.small{padding:5px 10px;font-size:.85rem}

main{padding-block:20px 48px;display:grid;gap:20px}
main>*,#view>*{min-width:0}
.notice{margin-top:12px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:.92rem}
.sec-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.sec-head h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.sec-head p{margin:0;color:var(--muted);font-size:.9rem}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h3{margin:0 0 4px;font-size:.8rem;letter-spacing:.04em;color:var(--muted);font-weight:600}
.big{font-size:1.9rem;font-weight:700;line-height:1.1}
.big.gold{color:var(--gold)}
.lines{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:4px;font-size:.9rem}
.lines li{display:flex;justify-content:space-between;gap:8px}
.lines li span:first-child{color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.g{background:var(--gold)}
.bar i.over{background:var(--bad)}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pill{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.gold{background:var(--gold-soft);color:var(--gold);border-color:transparent}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--muted);font-size:.85rem;margin-top:3px}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.check{width:24px;height:24px;flex:none;border-radius:6px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:14px;height:14px}
.late{color:var(--bad);font-weight:600}

.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{padding:10px 12px;text-align:start;border-top:1px solid var(--line);white-space:nowrap}
th{border-top:0;font-size:.78rem;color:var(--muted);font-weight:600;letter-spacing:.03em;background:var(--surface-2)}
td.n,th.n{text-align:end;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:700;background:var(--surface-2)}
td.name{white-space:normal;min-width:140px;font-weight:600}

.vgrid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.vcard{display:flex;flex-direction:column;gap:8px}
.vcard .top-line{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.vcard h4{margin:0;font-size:1.05rem;overflow-wrap:anywhere}
.vcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.vgroup{display:grid;gap:10px;margin:0 0 22px}
.vgroup>.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:6px}
.vgroup>.gh h3{margin:0;font-size:1.1rem}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vcard.won{border-color:var(--ok, #4a7a3a);box-shadow:0 0 0 1px var(--ok, #4a7a3a) inset}
.sel{user-select:all;direction:ltr;unicode-bidi:isolate}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:grid;gap:10px;justify-items:center}
.empty p{margin:0;color:var(--muted);max-width:46ch}
.empty strong{font-size:1.05rem}

.search{flex:1;min-width:180px;max-width:320px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(10,15,12,.45)}
.sheet-card{position:relative;background:var(--surface);width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px}
@media (min-width:640px){.sheet{align-items:center}.sheet-card{border-radius:14px}}
.sheet-card h2{font-family:var(--display);font-weight:400;margin:0;font-size:1.3rem}
.fields{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.field{display:grid;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field span{font-size:.82rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
@media (max-width:440px){.fields{grid-template-columns:1fr}}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
#sheetForm>.sheet-actions{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);margin-inline:-4px;padding:10px 4px calc(10px + env(safe-area-inset-bottom,0px));z-index:2}
.grid.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
@media (max-width:440px){.kpis .big{font-size:1.5rem}.kpis>.card:last-child:nth-child(odd){grid-column:1/-1}}
@media (max-width:640px){.frow{min-width:0;max-width:100%;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}.frow::-webkit-scrollbar{display:none}.frow>.chip{flex:none}}
.err{color:var(--bad);margin:0;font-size:.9rem}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;z-index:30;font-size:.92rem}
.upcoming{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.upcoming li{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;align-items:baseline}
.upcoming li .w{min-width:0;overflow-wrap:anywhere}
.drive-line{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.drive-line .hint{flex:1;min-width:220px}
.maplist{display:grid}
.maprow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.maprow:first-child{border-top:0}
.maprow select{flex:none;width:44%;max-width:200px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
#imp .field select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.giftrow{display:grid;gap:8px;align-items:center}
.qd summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:600}
a.chip,a.btn{text-decoration:none;color:inherit;display:inline-block}
@media (min-width:641px){.giftrow{grid-template-columns:minmax(0,1fr) auto}}
.only-narrow{display:none}
@media (max-width:640px){.only-wide{display:none}.only-narrow{display:block}}
.arch{border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px;background:var(--surface-2)}
.arch summary{cursor:pointer;color:var(--muted);font-weight:600}
.arch[open] summary{margin-bottom:10px}
.arch .row .btn{flex:none}
.cmp table{min-width:760px}
.cmp th:first-child,.cmp td:first-child{position:sticky;right:0;background:var(--surface);z-index:1;box-shadow:-1px 0 0 var(--line)}
.cmp thead th:first-child{background:var(--surface-2)}
.cmp tbody tr:hover td:first-child{background:var(--surface-2)}
.nextup{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:12px 14px}
.nextup b{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body{margin:0}
.gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:24px;text-align:center}
.gate-card{display:grid;gap:14px;justify-items:center;max-width:340px}
.gate-card h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;color:var(--ink)}
.gate-card p{margin:0;color:var(--muted)}
.gate-card img{width:96px;height:96px;border-radius:22px}
.gbtn{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:600;font-size:1rem;cursor:pointer}
.gbtn svg{width:20px;height:20px}
.heb{font-size:.82rem;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:1.2em}
.heb .pill{font-size:.75rem}
.qsec{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.qsec summary{cursor:pointer;font-weight:600;padding:4px 0}
.qsec[open] summary{margin-bottom:8px}
.qsec .field{margin-bottom:10px}
.qsec textarea{min-height:44px}
.qsave{font-size:.8rem;color:var(--muted)}
.ans td{white-space:normal;min-width:160px;vertical-align:top}
.ans td.q{min-width:200px;font-weight:600}
.me{display:flex;align-items:center;gap:8px;padding:8px 14px;color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="gate" class="gate" dir="rtl" lang="he">
  <div class="gate-card">
    <img src="icons/icon-192.png" alt="">
    <h1>החתונה שלנו</h1>
    <p>הכניסה לרועי ולנטע בלבד, עם חשבון הגוגל.</p>
    <button id="gateBtn" class="gbtn" type="button" hidden><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>כניסה עם Google</button>
    <p id="gateMsg" role="status"></p>
    <button id="gateOut" class="btn" type="button" hidden>יציאה והחלפת חשבון</button>
  </div>
</div>

<div dir="rtl" lang="he">
  <header class="top">
    <div class="wrap top-in">
      <button id="menuBtn" class="iconbtn" type="button" aria-label="תפריט" aria-expanded="false" aria-controls="drawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="brand">
        <h1 id="coupleTitle">החתונה שלנו</h1>
        <p id="countdown" class="sub">עוד לא נקבע תאריך</p>
      </div>
      <button id="settingsBtn" class="btn" type="button">הגדרות</button>
    </div>
  </header>
  <div class="wrap"><div id="notice" class="notice" hidden></div></div>
  <main class="wrap" id="main"></main>
</div>

<div id="drawer" class="drawer" hidden dir="rtl" lang="he">
  <div class="drawer-bg" data-dclose="1"></div>
  <nav class="drawer-card" aria-label="ניווט">
    <div class="drawer-head"><b>תפריט</b><button class="iconbtn" type="button" data-dclose="1" aria-label="סגירת התפריט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="drawerList" style="display:grid;gap:2px"></div>
    <div class="drawer-foot"><button class="dlink" type="button" data-act="settings">הגדרות</button><button class="dlink" type="button" data-act="backup">גיבוי ושחזור</button><div class="me" id="meLine"></div><button class="dlink" type="button" data-act="signout">יציאה</button></div>
  </nav>
</div>

<div id="sheet" class="sheet" hidden dir="rtl" lang="he">
  <div class="sheet-bg" data-close="1"></div>
  <form class="sheet-card" id="sheetForm" novalidate>
    <h2 id="sheetTitle"></h2>
    <div id="sheetFields" class="fields"></div>
    <p id="sheetErr" class="err" hidden></p>
    <div class="sheet-actions">
      <button type="submit" class="btn primary" id="saveBtn">שמירה</button>
      <button type="submit" class="btn" id="againBtn" hidden>שמירה והוספת עוד</button>
      <button type="button" class="btn ghost" data-close="1">ביטול</button>
      <button type="button" id="delBtn" class="btn danger" hidden>מחיקה</button>
    </div>

/* ---------- smart schedule ----------
   Each stage gets a due date = wedding date minus its offset.
   Stages whose date already passed are compressed, in order, into the window
   between today and the first stage that is still ahead ("מואץ").
   A task with its own due date is locked to it; clearing the date returns it to automatic. */
let SCHED={};
function computeSchedule(){
  SCHED={};
  const wd=parseD(S.settings.date);if(!wd)return;
  const t0=today(),DAY=864e5;
  const norm=STAGES.map(([k,,o])=>[k,new Date(wd.getTime()-o*DAY)]);
  const past=norm.filter(([,d])=>d<t0),ahead=norm.filter(([,d])=>d>=t0);
  const end=ahead.length?ahead[0][1]:wd;
  const win=Math.max(0,end-t0);
  past.forEach(([k],i)=>{const off=Math.round(win*(i+1)/(past.length+1)/DAY);SCHED[k]={due:new Date(t0.getTime()+off*DAY),fast:true}});
  ahead.forEach(([k,d])=>SCHED[k]={due:d,fast:false});
}
function eff(t){
  if(t.due){const d=parseD(t.due);if(d)return {d,kind:'manual'}}
  const s=t.stage&&SCHED[t.stage];
  if(s)return {d:s.due,kind:s.fast?'fast':'auto'};
  return {d:null,kind:null};
}
const stageIdx=k=>{const i=STAGES.findIndex(s=>s[0]===k);return i<0?99:i};
const fdateD=d=>d?d.toLocaleDateString('he-IL',{day:'numeric',month:'short',year:d.getFullYear()!==new Date().getFullYear()?'numeric':undefined}):'';
const isoD=d=>d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`:'';

/* ---------- derived numbers ---------- */
function cost(e){return num(e.actual)>0?num(e.actual):num(e.planned)}
const insts=e=>Array.isArray(e.installments)?e.installments:[];
function paidOf(e){const L=insts(e);return L.length?L.filter(i=>i.paid).reduce((a,i)=>a+num(i.amount),0):num(e.paid)}
function nextInst(e){return insts(e).filter(i=>!i.paid&&i.date).sort((a,b)=>a.date.localeCompare(b.date))[0]||null}
function isNight(i){return !!i.night||(!!S.settings.date&&i.date===S.settings.date)}
function money(list){
  const planned=list.reduce((a,e)=>a+cost(e),0), paid=list.reduce((a,e)=>a+paidOf(e),0);
  return {planned,paid,left:Math.max(0,planned-paid)};
}
function capRows(cats){
  const caps=S.settings.caps||{};
  return cats.map(([c])=>{const list=S.expenses.filter(e=>e.cat===c);const m=money(list);return {c,cap:num(caps[c]),exp:m.planned,paid:m.paid}})
    .filter(r=>r.cap||r.exp);
}
function overCaps(){return capRows([...ECATS,...XCATS]).filter(r=>r.cap&&r.exp>r.cap)}
function upcomingPays(){
  const out=[];
  for(const e of S.expenses){const L=insts(e);
    if(L.length)L.forEach(i=>{if(!i.paid&&i.date)out.push({name:e.name,date:i.date,amount:num(i.amount),method:i.method,night:isNight(i),id:e.id,side:e.side})});
    else if(e.due&&cost(e)>num(e.paid))out.push({name:e.name,date:e.due,amount:cost(e)-num(e.paid),id:e.id,side:e.side});
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function guestNums(){
  let invited=0,yes=0,no=0,pend=0,gifts=0,yesKids=0,kids=0;const bus={center:0,jlm:0};
  for(const g of S.guests){
    const c=Math.max(0,num(g.count)||1);invited+=c;kids+=Math.min(c,num(g.kids));
    if(g.rsvp==='yes'){const k=num(g.coming)>0?num(g.coming):c;yes+=k;yesKids+=Math.min(k,num(g.kids));no+=Math.max(0,c-k)}
    else if(g.rsvp==='no')no+=c;else pend+=c;
    if(g.rsvp!=='no'&&bus[g.shuttle]!==undefined)bus[g.shuttle]+=g.rsvp==='yes'&&num(g.coming)>0?num(g.coming):c;
    gifts+=num(g.gift);
  }
  gifts+=S.gifts.reduce((s,x)=>s+num(x.amount),0);
  return {invited,yes,no,pend,gifts,yesKids,kids,bus};
}
function giftsOf(gid){return S.gifts.filter(x=>x.guestId===gid)}
function giftSum(gid){return giftsOf(gid).reduce((s,x)=>s+num(x.amount),0)}
function groupBreakdown(key){
  const m=new Map();
  for(const g of S.guests){const k=(g[key]||'').trim()||'ללא';const r=m.get(k)||{k,inv:0,yes:0};const c=Math.max(0,num(g.count)||1);r.inv+=c;if(g.rsvp==='yes')r.yes+=num(g.coming)>0?num(g.coming):c;m.set(k,r)}
  return [...m.values()].sort((a,b)=>b.inv-a.inv);
}

/* ---------- render ---------- */
function tabCount(k){
  const live=a=>a.length;
  if(k==='venues')return live(S.venues);
  if(k==='tasks'){const o=S.tasks.filter(t=>t.status!=='done').length;return o?o+' פתוחות':''}
  if(k==='guests')return live(S.guests);
  if(k==='gifts')return live(S.gifts);
  if(k==='vendors')return live(S.vendors);
  return '';
}
function renderTabs(){
  const el=$('#drawerList');if(!el)return;
  el.innerHTML=TABS.map(([k,l])=>{const c=tabCount(k);return `<button class="dlink" type="button" data-tab="${k}" ${k===tab?'aria-current="page"':''}><span>${l}</span>${c?`<span class="cnt num">${c}</span>`:''}</button>`}).join('');
}

function closeDrawer(){if($('#drawer').hidden)return;$('#drawer').hidden=true;$('#menuBtn').setAttribute('aria-expanded','false')}
function renderHeader(){

  }else $('#countdown').textContent='עוד לא נקבע תאריך · אפשר לעדכן בהגדרות';
}
function addBtn(kind,label){return canWrite?`<button class="btn primary" type="button" data-act="add" data-kind="${kind}">${label}</button>`:''}
function empty(title,text,kind,label,extra=''){

}
function bar(parts){return `<div class="bar">${parts.map(([v,c])=>`<i class="${c||''}" style="width:${Math.max(0,Math.min(100,v))}%"></i>`).join('')}</div>`}

function render(){

function vOverview(){

  return `
  ${nextLine}
  <div class="grid">
    <section class="card">
      <h3>תקציב</h3>
      ${budget?`<div class="big num ${over?'':'gold'}" style="${over?'color:var(--bad)':''}">${ils(Math.abs(budget-all.planned))}</div>
        <p class="hint" style="margin-top:2px">${over?'חריגה מעל התקציב':'נשאר לא מוקצה מתוך התקציב'}</p>
        ${bar([[all.paid/budget*100,'g'],[(all.planned-all.paid)/budget*100,over?'over':'']])}`
      :`<div class="big num gold">${ils(all.planned)}</div><p class="hint" style="margin-top:2px">עלות צפויה. הגדירו תקציב כולל כדי לראות כמה נשאר.</p>`}
      <ul class="lines num">
        ${budget?`<li><span>תקציב כולל</span><span>${ils(budget)}</span></li>`:''}
        <li><span>חתונה (ספקים ואירוע)</span><span>${ils(main.planned)}</span></li>
        <li><span>הוצאות נלוות</span><span>${ils(side.planned)}</span></li>
        <li><span>שולם</span><span>${ils(all.paid)}</span></li>
        <li><span>נותר לשלם</span><span>${ils(all.left)}</span></li>
      </ul>
      ${capsOver.length?`<p class="hint" style="color:var(--bad)"><b>חריגה מהתקרה:</b> ${capsOver.map(r=>h(r.c)).join(', ')}</p>`:''}
    </section>
    <section class="card">
      <h3>אורחים</h3>
      <div class="big num">${g.invited||num(st.guestEst)||0}</div>
      <p class="hint" style="margin-top:2px">${g.invited?'מוזמנים ברשימה':'הערכה ראשונית'}</p>
      ${g.invited?bar([[g.yes/g.invited*100,''],[g.no/g.invited*100,'over']]):''}
      <ul class="lines num">
        <li><span>מגיעים</span><span>${g.yes}${g.yesKids?` (${g.yes-g.yesKids} מבוגרים, ${g.yesKids} ילדים)`:''}</span></li>
        <li><span>טרם ענו</span><span>${g.pend}</span></li>
        <li><span>לא מגיעים</span><span>${g.no}</span></li>
        ${g.bus.center||g.bus.jlm?`<li><span>הסעה מהמרכז / מירושלים</span><span>${g.bus.center} / ${g.bus.jlm}</span></li>`:''}
      </ul>
    </section>
    <section class="card">
      <h3>מנות מול מתנות</h3>

      <div class="big num ${giftsEst>=catering?'':''}" style="color:${giftsEst-catering>=0?'var(--ok)':'var(--bad)'}">${giftsEst-catering>=0?'+':'−'}${ils(Math.abs(giftsEst-catering))}</div>
      <p class="hint" style="margin-top:2px">פער משוער לפי ${people} ${peopleLbl}</p>
      <ul class="lines num">

        <li><span>מתנות שנרשמו</span><span>${ils(g.gifts)}</span></li>
      </ul>`:`<p class="hint">הזינו בהגדרות מחיר למנה ומתנה ממוצעת לאורח, ונחשב כאן כמה מכוסה מעלות האולם.</p>${canWrite?'<button class="btn small" type="button" data-act="settings" style="margin-top:10px">פתיחת הגדרות</button>':''}`}
    </section>

      <h3>משימות</h3>
      <div class="big num">${done}<span style="font-size:1rem;color:var(--muted);font-weight:500"> / ${tot}</span></div>
      <p class="hint" style="margin-top:2px">${tot?'משימות שבוצעו':'עוד אין משימות'}</p>
      ${tot?bar([[done/tot*100,'']]):''}
      ${!tot&&canWrite?'<button class="btn small" type="button" data-act="template" style="margin-top:10px">טעינת רשימת משימות מומלצת</button>':''}
    </section>
  </div>
  <div class="grid">
    <section class="card">
      <div class="sec-head"><h2>הבאות בתור</h2><button class="btn small ghost" type="button" data-tab="tasks">לכל המשימות</button></div>
      ${nextTasks.length?`<ul class="upcoming">${nextTasks.map(t=>{const d=eff(t).d;return `<li><span class="w">${h(t.title)}</span><span class="num ${d&&d<t0?'late':''}" style="color:${d&&d<t0?'':'var(--muted)'}">${d?fdateD(d):h(lab(STAGES.map(([k,l])=>[k,l]),t.stage)||lab(OWNER(),t.owner))}</span></li>`}).join('')}</ul>`:'<p class="hint">אין משימות פתוחות.</p>'}
    </section>
    <section class="card">
      <div class="sec-head"><h2>תשלומים קרובים</h2><button class="btn small ghost" type="button" data-tab="budget">לתקציב</button></div>
      ${pays.length?`<ul class="upcoming">${pays.map(p=>{const d=parseD(p.date);return `<li><span class="w">${h(p.name)} <span class="num" style="color:var(--muted)">· ${fdate(p.date)}${p.method?' · '+h(lab(METHODS,p.method)):''}</span></span><span class="num ${d&&d<t0?'late':''}">${ils(p.amount)}</span></li>`}).join('')}</ul>`:'<p class="hint">אין תשלומים עם מועד שנקבע. הוסיפו לוח תשלומים להוצאה כדי שתופיע כאן.</p>'}
    </section>
  </div>
  ${activityCard()}`;
}

function taskRow(t,t0){

    <button class="check" type="button" role="checkbox" aria-checked="${done}" aria-label="סימון כבוצע" data-act="toggle" data-id="${h(t.id)}" ${canWrite?'':'disabled'}>${done?'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 8.5l3.2 3L13 4.5"/></svg>':''}</button>
    <div class="main" data-act="edit" data-kind="tasks" data-id="${h(t.id)}">
      <div class="t">${h(t.title)}</div>
      <div class="meta"><span class="pill acc">${h(lab(OWNER(),t.owner))}</span>${t.cat?`<span>${h(t.cat)}</span>`:''}${t.status==='doing'?'<span class="pill warn">בתהליך</span>':''}${e.d?`<span class="num ${isLate?'late':''}">${isLate?'באיחור · ':''}${fdateD(e.d)}</span>`:''}${tag}</div>
    </div></div>`;
}

  ${S.tasks.length&&!hasDate?`<div class="notice" style="margin:0">עוד לא נקבע תאריך, אז המשימות מסודרות לפי שלבים בלי תאריכים. כשתזינו תאריך בהגדרות, כל משימה תקבל תאריך יעד אוטומטי.</div>`:''}
  ${fastOpen?`<div class="notice" style="margin:0">החתונה קרובה יותר מ-12 חודשים, אז ${fastOpen} משימות משלבים מוקדמים נדחסו לשבועות הקרובים לפי הסדר. הן מסומנות "מואץ".</div>`:''}
  <div class="chips frow">${filters.map(([k,l])=>`<button class="chip" type="button" data-tfilter="${k}" aria-pressed="${k===taskFilter}">${h(l)}</button>`).join('')}</div>

  !groups.length?'<p class="hint">אין משימות בסינון הזה.</p>':
  groups.map(g=>{const s=SCHED[g.k];const open=g.items.filter(t=>t.status!=='done').length;
    return `<section style="display:grid;gap:8px">
      <div class="sec-head"><h3 style="margin:0;font-size:1rem">${h(g.l)}</h3><span class="hint num" style="margin:0">${s?`${s.fast?'מואץ · ':''}עד ${fdateD(s.due)} · `:''}${open} פתוחות</span></div>

}

function logAct(text){if(!db||!text)return;db.collection('activity').add({at:Date.now(),by:who(),text:String(text).slice(0,160)}).catch(()=>{})}

const ago=t=>{const m=Math.round((Date.now()-t)/6e4);if(m<1)return 'עכשיו';if(m<60)return `לפני ${m} דק׳`;const hh=Math.round(m/60);if(hh<24)return hh===1?'לפני שעה':`לפני ${hh} שעות`;const d=Math.round(hh/24);return d===1?'אתמול':d<7?`לפני ${d} ימים`:new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'short'})};

/* ---------- closing a vendor ticks off its checklist task ---------- */
const V2T={'אולם / גן אירועים':['לסגור אולם ותאריך ולשלם מקדמה'],'צלם סטילס':['צלם סטילס'],'צלם וידאו':['צלם וידאו / מגנטים'],'דיג׳יי / להקה':['דיג׳יי או להקה'],'עורך טקס':['עורך טקס / רב'],'רב / מסדר קידושין':['עורך טקס / רב'],'עיצוב ופרחים':['עיצוב ופרחים (אם לא כלול באולם)'],'איפור ושיער':['איפור ושיער: לבחור ולסגור'],'הסעות':['הסעות: לבחור חברה ולשריין'],'תכשיטים וטבעות':['טבעות'],'הזמנות':['לעצב ולהזמין הזמנות']};
async function completeTasksFor(v){
  const titles=V2T[v.type]||[];const open=S.tasks.filter(t=>t.status!=='done'&&titles.includes((t.title||'').trim()));
  for(const t of open){try{await db.doc('tasks/'+t.id).update({status:'done',updatedAt:Date.now(),note:[t.note,`סומן אוטומטית כשנסגר ${v.name}`].filter(Boolean).join(' · ')})}catch(_){}}
  return open.length;
}

/* ---------- shuttles: how many vehicles for each pickup point ---------- */
function vehiclePlan(n){
  if(n<=0)return '';const out=[];let left=n;
  while(left>50){out.push('אוטובוס');left-=50}
  out.push(left>32?'אוטובוס':left>20?'מידיבוס':'מיניבוס');
  const c={};out.forEach(x=>c[x]=(c[x]||0)+1);
  return Object.entries(c).map(([k,v])=>v>1?`${v} ${k==='אוטובוס'?'אוטובוסים':k==='מידיבוס'?'מידיבוסים':'מיניבוסים'}`:k).join(' + ');
}
function shuttleCard(){
  const pts=[['center','מהמרכז'],['jlm','מירושלים']];
  const row=k=>{let yes=0,maybe=0;for(const g of S.guests){if(g.shuttle!==k||g.rsvp==='no')continue;const c=Math.max(0,num(g.count)||1);if(g.rsvp==='yes')yes+=num(g.coming)>0?num(g.coming):c;else maybe+=c}return {yes,maybe}};
  const rows=pts.map(([k,l])=>({k,l,...row(k)})).filter(r=>r.yes||r.maybe);
  if(!rows.length)return '';
  return `<section class="card"><h3>תכנון הסעות</h3><ul class="lines num">${rows.map(r=>`<li style="align-items:flex-start"><span>${h(r.l)}: <b>${r.yes}</b> אישרו${r.maybe?` · עוד ${r.maybe} שסימנו הסעה וטרם ענו`:''}</span><span style="text-align:end">${h(vehiclePlan(r.yes+r.maybe))}</span></li>`).join('')}</ul>
    <p class="hint" style="margin:6px 0 0">החישוב כולל גם מי שעוד לא ענה. גדלים טיפוסיים: מיניבוס עד 20, מידיבוס עד 32, אוטובוס עד 50. כדאי לוודא מול חברת ההסעות.</p></section>`;
}

/* ---------- vendors: compare offers per type, close one, budget follows ---------- */
async function addVendorExpense(v){
  const q=num(v.quote),dep=num(v.deposit),now=Date.now();const installments=[];
  if(dep)installments.push({id:'i'+now,amount:dep,date:isoD(today()),method:'transfer',paid:true,night:false});
  if(q>dep)installments.push({id:'i'+(now+1),amount:q-dep,date:S.settings.date||'',method:'check',paid:false,night:true});
  const side=!!V2X[v.type];
  await db.collection('expenses').add({name:v.name,cat:side?V2X[v.type]:(V2E[v.type]||'אחר'),funder:'',planned:q,actual:q,installments,files:v.files||[],note:v.included?('כלול: '+v.included):'',side,vendorId:v.id,createdAt:now});
  return side;
}
async function vendorClosed(v){
  if(!db)return;
  logAct(`נסגר ספק: ${v.name}${v.type?' ('+v.type+')':''}`);
  const nt=await completeTasksFor(v);const tasksMsg=nt?` · ${nt===1?'משימה סומנה':nt+' משימות סומנו'} כבוצע`:'';
  if(S.expenses.some(e=>e.vendorId===v.id)){toast('הספק סומן כנסגר'+tasksMsg);return}

}

/* keep numeric ranges like 270–540 in reading order inside RTL text */
function rng(s){return h(s).replace(/(\d[\d,]*)\s*[–-]\s*(\d[\d,]*)/g,'<span dir="ltr" class="num" style="unicode-bidi:isolate">$1–$2</span>')}

/* ---------- Hebrew dates and days people don't marry on ---------- */
const gem=n=>{if(n===15)return 'ט״ו';if(n===16)return 'ט״ז';const o=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],t=['','י','כ','ל'];const x=t[Math.floor(n/10)]+o[n%10];return x.length>1?x.slice(0,-1)+'״'+x.slice(-1):x+'׳'};
let hEn=null,hHe=null;try{hEn=new Intl.DateTimeFormat('en-u-ca-hebrew',{day:'numeric',month:'long'});hHe=new Intl.DateTimeFormat('he-u-ca-hebrew',{month:'long'})}catch(_){}
function hebInfo(iso){
  const d=iso&&new Date(String(iso).slice(0,10)+'T12:00:00');if(!d||isNaN(d)||!hEn)return null;
  const p=hEn.formatToParts(d);const day=+((p.find(x=>x.type==='day')||{}).value),m=(p.find(x=>x.type==='month')||{}).value;
  const label=gem(day)+' ב'+hHe.format(d);const dow=d.getDay();
  const R=(lvl,note)=>({label,lvl,note});const inR=(mm,a,b)=>m===mm&&day>=a&&day<=b;
  if(inR('Tishri',1,2))return R('bad','ראש השנה');
  if(m==='Tishri'&&day===3)return R('bad','צום גדליה');
  if(inR('Tishri',9,10))return R('bad','יום כיפור');
  if(inR('Tishri',14,22))return R('bad','סוכות וחול המועד');
  if(m==='Tevet'&&day===10)return R('bad','עשרה בטבת');
  if((m==='Adar'||m==='Adar II')&&day===13)return R('warn','תענית אסתר');
  if((m==='Adar'||m==='Adar II')&&(day===14||day===15))return R('warn','פורים: מתחתנים לעיתים רחוקות');
  if(inR('Nisan',14,21))return R('bad','פסח וחול המועד');
  if((m==='Nisan'&&day>=22)||inR('Iyar',1,17))return R('bad','ספירת העומר: לא מתחתנים עד ל״ג בעומר');
  if(m==='Iyar'&&day===18)return R('ok','ל״ג בעומר: תאריך מבוקש');
  if(m==='Iyar'||inR('Sivan',1,5))return R('warn','אחרי ל״ג בעומר: מותר ברוב המנהגים, כדאי לוודא עם הרב');
  if(m==='Sivan'&&day===6)return R('bad','שבועות');
  if((m==='Tamuz'&&day>=17)||inR('Av',1,9))return R('bad','בין המצרים');
  if(dow===6)return R('warn','שבת: רק במוצאי שבת');
  if(dow===5)return R('warn','יום שישי: אירוע צהריים בלבד');
  return R('ok','');
}
function hebHTML(iso,withStatus){const i=hebInfo(iso);if(!i)return '';
  return `<span>${h(i.label)}</span>${withStatus&&i.lvl!=='ok'?`<span class="pill ${i.lvl==='bad'?'bad':'warn'}">${h(i.note)}</span>`:withStatus&&i.note?`<span class="pill ok">${h(i.note)}</span>`:''}`}

/* ---------- total cost per venue and date ---------- */
const guestsN=()=>costN||num(S.settings.guestEst)||450;
function totalFor(v,q,N){const per=num(q.price)+num(v.extraPerPlate);const plates=Math.max(N,num(q.minGuests));return per*plates+num(v.extraFixed)}
/* cheapest quote, skipping dates people don't marry on when there is another option */
function bestTotal(v,N){const qs=quotesOf(v);if(!qs.length)return null;const okd=qs.filter(q=>{const i=hebInfo(q.date);return !i||i.lvl!=='bad'});return (okd.length?okd:qs).map(q=>({q,t:totalFor(v,q,N)})).sort((a,b)=>a.t-b.t)[0]}

 ['תאריכים פנויים',['אילו תאריכים פנויים במרץ, באפריל ובמאי 2027?','מה פנוי באמצע השבוע, מה בחמישי ומה בשישי בצהריים?','אפשר לשריין תאריך בלי מקדמה, ולכמה זמן?','יש אירוע נוסף במתחם באותו ערב? (חניה, רעש, שירותים)','באיזו שעה מתחילה קבלת הפנים, ועד מתי אפשר להישאר?']],
 ['מחיר',['מה המחיר למנה באביב, באמצע השבוע? וכמה בחמישי ובשישי בצהריים?','המחיר כולל מע״מ?','מה מינימום המנות, ומתי צריך לתת מספר סופי?','כמה עולה מנת ילד, ומאיזה גיל?','כמה עולות מנות לספקים (צלם, דיג׳יי)?','מה קורה למחיר מעל 500 אורחים? יש הנחה על כמות?','יש הצעה מיוחדת לתאריכים שעוד לא נמכרו?']],
 ['כשרות',['מי הגוף המשגיח, בשמו?','המהדרין כלול במחיר או בתוספת? כמה למנה?','המטבח כולו באותה כשרות, או שמביאים קייטרינג מבחוץ?','יש משגיח קבוע באירוע? אפשר משגיח פרטי, ובאיזו עלות?','אפשר לקבל צילום של תעודת הכשרות העדכנית?']],
 ['קיבולת ומבנה המקום',['כמה אורחים בישיבה מלאה לארוחה?','האורחים יושבים בגן, באולם או בשניהם?','יש רחבת חופה נפרדת? איפה, וכמה אנשים עומדים בה?','מה התוכנית אם יורד גשם? יש קירוי או אוהל, ובתשלום?','מה גודל הרחבה, ויש אפשרות להפרדה?','יש תוכנית קומה של המקום?','יש מרחב מוגן במקום?']],
 ['מה כלול במחיר',['עיצוב: מה בסיסי, ומה עולה בנפרד?','הגברה ותאורה: כלול או שמביאים ספק?','בר: מה כלול, ומה בתוספת?','קבלת פנים: כמה עמדות וכמה זמן?','יש סוויטת התארגנות לחתן ולכלה?','חובה לעבוד עם ספקים של המקום? ספק חיצוני בתוספת?','שירותים, מיזוג וניקיון: כלול?']],
 ['אוכל ושירות',['יש טעימות? כמה אנשים, ובתשלום?','אפשר תפריט לדוגמה? כמה מנות עיקריות לבחירה?','מה היחס של מלצרים לאורחים?','יש מנות צמחוניות, טבעוניות וללא גלוטן, באותו מחיר?','יש מנהל/ת אירוע צמוד/ה מההתחלה עד הערב?','אפשר לראות אירוע אמיתי לפני חתימה?']],
 ['לוגיסטיקה',['כמה מקומות חניה, והאם בחינם?','המקום נגיש לכיסאות גלגלים ולמבוגרים, כולל שירותים?','יש מקום לאוטובוסים לעצור ולהוריד נוסעים?','מה השעה האחרונה של מוזיקה? יש מגבלת רעש?','יש תחבורה ציבורית קרובה?']],
 ['חוזה ותשלומים',['כמה מקדמה בחתימה, ומה לוח התשלומים?','באיזה אמצעי תשלום? אפשר תשלומים?','מה משלמים בערב האירוע עצמו?','מה תנאי הביטול, כולל מצב ביטחוני או הנחיות פיקוד העורף?','המחיר נעול בחוזה או צמוד למדד?','אפשר טיוטת חוזה לקריאה לפני שמתחייבים?']],
].map(([t,q],si)=>({t,q:q.map((text,qi)=>({id:`s${si+1}q${qi+1}`,text}))}));
const QTOTAL=QSECTIONS.reduce((a,s)=>a+s.q.length,0);
const answersOf=v=>v.answers&&typeof v.answers==='object'?v.answers:{};
const answeredCount=(v,sec)=>(sec?sec.q:QSECTIONS.flatMap(s=>s.q)).filter(q=>String(answersOf(v)[q.id]||'').trim()).length;
let qTimers={},qPending={};
function openQ(id){if(!S.venues.find(x=>x.id===id))return;IMP={step:'q',id};$('#imp').hidden=false;renderQ()}
function renderQ(){
  const v=S.venues.find(x=>x.id===IMP.id);if(!v)return;const a=answersOf(v);
  $('#impCard').innerHTML=`<div class="sec-head"><h2 id="impTitle">שאלון – ${h(v.name)}</h2><button type="button" class="btn small" data-iclose="1">סגירה</button></div>
    <p class="hint" style="margin:0">התשובות נשמרות לבד תוך כדי כתיבה, ושניכם רואים אותן. <span id="qCount" class="num">${answeredCount(v)}/${QTOTAL}</span> נענו. <span id="qSave" class="qsave" role="status"></span></p>
    ${QSECTIONS.map((sec,si)=>`<details class="qsec" ${si===0?'open':''}><summary>${si+1}. ${h(sec.t)} <span class="hint num" style="margin:0;font-weight:400">(${answeredCount(v,sec)}/${sec.q.length})</span></summary>
      ${sec.q.map(q=>`<label class="field" for="qa_${q.id}"><span>${h(q.text)}</span><textarea id="qa_${q.id}" data-qa="${q.id}" rows="2" ${canWrite?'':'readonly'}>${h(a[q.id]||'')}</textarea></label>`).join('')}</details>`).join('')}
    <div class="sheet-actions"><button type="button" class="btn primary" data-iclose="1">סיום</button></div>`;
}
async function saveAnswer(vid,qid,val){
  const el=$('#qSave');if(el)el.textContent='שומר…';
  try{await db.doc('venues/'+vid).update({['answers.'+qid]:val,updatedAt:Date.now()});if(el)el.textContent='נשמר'}
  catch(e){if(el)el.textContent=errMsg(e)}
}
function flushQ(){Object.keys(qTimers).forEach(k=>{clearTimeout(qTimers[k]);const p=qPending[k];if(p)saveAnswer(p.vid,p.qid,p.val)});qTimers={};qPending={}}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.qa&&IMP&&IMP.step==='q'&&db&&canWrite){
    const vid=IMP.id,qid=t.dataset.qa,key=vid+'|'+qid;qPending[key]={vid,qid,val:t.value};clearTimeout(qTimers[key]);
    qTimers[key]=setTimeout(()=>{delete qTimers[key];const p=qPending[key];delete qPending[key];if(p)saveAnswer(p.vid,p.qid,p.val)},700);
    const c=$('#qCount');if(c)c.textContent=[...document.querySelectorAll('#impCard [data-qa]')].filter(x=>x.value.trim()).length+'/'+QTOTAL;
  }
  if(t.matches&&t.matches('#sheet input[type=date]')){const box=t.closest('label,div')&&t.parentElement.querySelector('.heb');if(box)box.innerHTML=hebHTML(t.value,t.dataset.wed==='1')}
});
function answersTable(list){
  const vs=list.filter(v=>answeredCount(v)>0);
  const sec=QSECTIONS[qSec]||QSECTIONS[0];
  return `<div class="chips frow">${QSECTIONS.map((s,i)=>`<button class="chip" type="button" data-qsec="${i}" aria-pressed="${i===qSec}">${h(s.t)}</button>`).join('')}</div>
  ${vs.length?`<div class="list" style="display:grid;gap:10px">${sec.q.map(q=>`<section class="card" style="padding:12px 14px"><b>${h(q.text)}</b>
      <ul class="lines" style="margin-top:6px">${vs.map(v=>{const x=String(answersOf(v)[q.id]||'').trim();return `<li style="align-items:flex-start"><span style="flex:none;color:var(--muted)">${h(v.name)}</span><span style="text-align:end;overflow-wrap:anywhere">${x?h(x):'<span class="hint" style="margin:0">–</span>'}</span></li>`}).join('')}</ul></section>`).join('')}</div>
    <p class="hint">מוצגים רק אולמות שיש להם תשובות. ממלאים דרך "שאלון" בכרטיס האולם.</p>`
  :'<p class="hint">עוד אין תשובות. בפגישה פותחים "שאלון" בכרטיס האולם וכותבים תוך כדי שיחה.</p>'}`;
}

/* ---------- venue quotes by date ---------- */
const quotesOf=v=>Array.isArray(v.quotes)?v.quotes.filter(q=>num(q.price)>0):[];
function bestQuote(v){const all=quotesOf(v),okd=all.filter(q=>{const i=hebInfo(q.date);return !i||i.lvl!=='bad'});const q=(okd.length?okd:all).slice().sort((a,b)=>num(a.price)-num(b.price))[0];return q||(num(v.priceQuote)?{price:num(v.priceQuote),date:''}:null)}
const fdShort=s=>{const d=parseD(s);return d?d.toLocaleDateString('he-IL',{weekday:'short',day:'numeric',month:'numeric',year:'2-digit'}):''};

/* ---------- meetings + Google Calendar ----------
   A meeting is saved in the app first; then, when the viewer's Google Calendar connector
   is available, an event is created (popup reminders a day and 2 hours before, partner invited).
   If the calendar step fails the meeting stays, marked "not in calendar", with a retry button. */
const GCAL='Google Calendar';
const meetStart=m=>m.date&&m.time?new Date(m.date+'T'+m.time+':00'):null;
function meetWith(m){
  if(m.vendorId){const v=S.vendors.find(x=>x.id===m.vendorId);return {kind:'vendor',v:v||{},name:(v&&v.name)||m.withName||''}}
  const v=S.venues.find(x=>x.id===m.venueId);return {kind:'venue',v:v||{},name:(v&&v.name)||m.venueName||''}}
function upcomingMeetings(){const now=Date.now();return S.meetings.filter(m=>{const d=meetStart(m);return d&&d.getTime()>now-3600e3}).sort((a,b)=>meetStart(a)-meetStart(b))}
const fmtMeet=m=>{const d=meetStart(m);return d?d.toLocaleString('he-IL',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):''};
const pad2=n=>String(n).padStart(2,'0');
function localIso(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}:00`}
function calErr(e){const c=e&&e.code;
  if(c==='server_not_connected'||c==='selection_required')return 'החיבור ליומן עוד לא הוגדר באפליקציה.';
  if(c==='needs_reauth')return 'החיבור ליומן פג. לוחצים "הוספה ליומן" ומאשרים שוב.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return 'צריך לאשר לאפליקציה גישה ליומן. לוחצים "הוספה ליומן" ומאשרים.';
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return 'צריך להתחבר כדי להוסיף ליומן.';
  if(c==='tool_error')return 'היומן החזיר שגיאה: '+String(e.message||'').slice(0,120);
  return 'לא הצלחתי להוסיף ליומן כרגע.';}
function eventIdOf(r){const p=pj(r);return p.id||p.eventId||(p.event&&p.event.id)||''}
function eventLinkOf(r){const p=pj(r);return p.htmlLink||(p.event&&p.event.htmlLink)||p.link||''}
function meetingEventInput(m){
  const w=meetWith(m),v=w.v;const st=meetStart(m);const en=new Date(st.getTime()+(num(m.duration)||60)*60e3);
  const desc=[v.contact?`איש קשר: ${v.contact}`:'',v.phone?`טלפון: ${v.phone}`:'',v.kashrut?`כשרות: ${v.kashrut}`:'',m.note?`לבדוק: ${m.note}`:'',safeUrl(v.link)?`קישור: ${safeUrl(v.link)}`:''].filter(Boolean).join('\n');
  const title=w.kind==='vendor'?`פגישה עם ${v.type&&v.type!=='אחר'?v.type.split(' / ')[0]+' – ':''}${w.name}`:`פגישה באולם ${w.name}`;
  const inp={summary:`${title} – החתונה של ${names().join(' ו')}`,startTime:localIso(st),endTime:localIso(en),
    description:desc,overrideReminders:[{method:'popup',minutes:1440},{method:'popup',minutes:120}]};
  const loc=w.kind==='vendor'?'':[v.name,v.city].filter(Boolean).join(', ');if(loc)inp.location=loc;
  const em=(S.settings.inviteEmail||'').trim();
  if(m.invite!=='no'&&/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))inp.attendees=[{email:em}];
  return inp;
}
async function syncMeetingCal(id,prev){
  const m=S.meetings.find(x=>x.id===id)||prev;if(!m||!db)return;
  if(!mcp){await db.doc('meetings/'+id).update({calStatus:'failed',calError:calErr({code:'not_granted'})}).catch(()=>{});return}
  try{
    const inp=meetingEventInput(m);
    if(m.eventId){
      const upd={eventId:m.eventId,summary:inp.summary,startTime:inp.startTime,endTime:inp.endTime,description:inp.description};if(inp.location)upd.location=inp.location;
      const em=(S.settings.inviteEmail||'').trim();
      if(prev&&prev.invite!==m.invite&&em){if(m.invite==='no')upd.removedAttendeeEmails=[em];else upd.addedAttendees=[{email:em}]}
      await mcp.callTool(GCAL,'update_event',upd,{cache:false});
      await db.doc('meetings/'+id).update({calStatus:'ok',calError:''});
    }else{
      const r=await mcp.callTool(GCAL,'create_event',inp,{cache:false});
      await db.doc('meetings/'+id).update({calStatus:'ok',calError:'',eventId:eventIdOf(r),eventLink:eventLinkOf(r)});
      toast('נוסף ליומן');
    }
  }catch(e){await db.doc('meetings/'+id).update({calStatus:'failed',calError:calErr(e)}).catch(()=>{});toast(calErr(e))}
}
async function removeMeetingCal(m){
  if(!m||!m.eventId||!mcp)return;
  try{await mcp.callTool(GCAL,'delete_event',{eventId:m.eventId},{cache:false})}catch(e){toast('הפגישה הועברה לארכיון, אבל לא הצלחתי למחוק אותה מהיומן. מחקו אותה ביומן ידנית.')}
}
function meetingLine(v,key='venueId'){
  const ms=S.meetings.filter(m=>m[key]===v.id).sort((a,b)=>meetStart(a)-meetStart(b));if(!ms.length)return '';
  const now=Date.now();
  return `<ul class="upcoming" style="margin:0">${ms.map(m=>{const past=meetStart(m)&&meetStart(m).getTime()<now;const lk=safeUrl(m.eventLink);
    return `<li><span class="w" style="cursor:pointer" data-act="edit" data-kind="meetings" data-id="${h(m.id)}">${past?'היתה פגישה':'פגישה'}: <b class="num">${h(fmtMeet(m))}</b></span>
      <span class="chips" style="flex:none">${m.calStatus==='ok'?(lk?`<a class="chip" href="${h(lk)}" target="_blank" rel="noopener noreferrer">ביומן ✓</a>`:'<span class="pill ok">ביומן</span>'):(canWrite&&!past?`<button class="chip" type="button" data-act="calretry" data-id="${h(m.id)}" title="${h(m.calError||'')}">הוספה ליומן</button>`:'')}</span></li>`}).join('')}</ul>`;
}
function safeUrl(u){try{const x=new URL(u);return x.protocol==='https:'||x.protocol==='http:'?x.href:''}catch(e){return ''}}
function vVenues(){
  const need=num(S.settings.guestEst)||600;
  const order={quote:0,visited:1,tour:2,check:3,out:4};
  let list=S.venues.slice();
  if(venueFilter==='active')list=list.filter(v=>v.status!=='out');
  else if(venueFilter!=='all')list=list.filter(v=>(v.status||'check')===venueFilter);
  if(venueRegion!=='all')list=list.filter(v=>v.region===venueRegion);
  list.sort((x,y)=>(order[x.status]??3)-(order[y.status]??3)||num(y.myScore)-num(x.myScore)||(x.name||'').localeCompare(y.name||'','he'));
  const cnt=k=>S.venues.filter(v=>(v.status||'check')===k).length;
  const sFilters=[['active','בתהליך'],['all','הכל'],...VNSTATUS.map(([k,l])=>[k,`${l} (${cnt(k)})`])];
  const regions=[['all','כל האזורים'],...VNREGION.filter(([r])=>S.venues.some(v=>v.region===r))];
  const yn=v=>v==='yes'?'<span class="pill ok">יש</span>':v==='no'?'<span class="pill bad">אין</span>':'<span class="pill">לא ידוע</span>';
  return `
  <div class="sec-head"><div><h2>אולמות</h2><p class="num">${S.venues.length} מקומות במעקב · ${upcomingMeetings().length} פגישות קרובות · ${S.venues.filter(v=>bestQuote(v)).length} עם הצעת מחיר</p></div>${addBtn('venues','אולם חדש')}</div>
  ${S.venues.length?`
  <div class="chips frow">${sFilters.map(([k,l])=>`<button class="chip" type="button" data-vfilter="${k}" aria-pressed="${k===venueFilter}">${h(l)}</button>`).join('')}</div>
  ${regions.length>2?`<div class="chips frow">${regions.map(([k,l])=>`<button class="chip" type="button" data-vregion="${h(k)}" aria-pressed="${k===venueRegion}">${h(l)}</button>`).join('')}</div>`:''}
  <div class="chips frow"><button class="chip" type="button" data-vview="cards" aria-pressed="${venueView==='cards'}">כרטיסים</button><button class="chip" type="button" data-vview="table" aria-pressed="${venueView==='table'}">טבלת השוואה</button><button class="chip" type="button" data-vview="answers" aria-pressed="${venueView==='answers'}">תשובות מהשאלון</button></div>
  ${S.venues.some(v=>quotesOf(v).length)&&venueView!=='answers'?`<div class="chips frow" style="align-items:center"><span class="hint" style="margin:0;flex:none">עלות משוערת ל-</span>${[...new Set([400,num(S.settings.guestEst)||450,500,600])].sort((a,b)=>a-b).map(n=>`<button class="chip num" type="button" data-costn="${n}" aria-pressed="${guestsN()===n}">${n}</button>`).join('')}<span class="hint" style="margin:0;flex:none">אורחים</span></div>`:''}
  ${list.length?(venueView==='answers'?answersTable(list):venueView==='table'?venueTable(list,need):`<div class="vgrid">${list.map(v=>{
    const st=v.status||'check';const cls={quote:'gold',visited:'ok',tour:'acc',check:'',out:'bad'}[st];
    const small=num(v.capMax)&&num(v.capMax)<need;
    const url=safeUrl(v.link);
    const linked=v.vendorId&&S.vendors.some(x=>x.id===v.vendorId);
    return `<article class="card vcard" style="${st==='out'?'opacity:.65':''}">
      <div class="top-line"><div style="min-width:0"><h4>${h(v.name)}</h4><div class="hint" style="margin:2px 0 0">${h([v.type,v.city,v.region].filter(Boolean).join(' · '))}</div></div><span class="pill ${cls}">${lab(VNSTATUS,st)}</span></div>
      <ul class="lines num" style="margin:0">
        <li><span>קיבולת</span><span>${num(v.capMax)?`עד ${num(v.capMax)}${small?' <span class="pill warn">קטן מדי?</span>':''}`:'לא ידוע'}</span></li>
        <li><span>מחיר למנה</span><span>${(()=>{const b=bestQuote(v);return b?`<b>${ils(b.price)}</b>${b.date?` <span class="hint" style="margin:0">(${h(fdShort(b.date))})</span>`:' (הצעה)'}`:v.priceEst?rng(v.priceEst):'לא ידוע'})()}</span></li>
        ${(()=>{const bt=bestTotal(v,guestsN());return bt?`<li><span>עלות משוערת (${guestsN()})</span><span><b>${ils(bt.t)}</b></span></li>`:''})()}
        <li><span>כשרות</span><span style="text-align:end">${h(v.kashrut||'לא ידוע')}</span></li>
        <li><span>חופה נפרדת</span><span>${yn(v.chuppah)}</span></li>
        <li><span>ביקורות</span><span>${num(v.rating)?`★ ${num(v.rating).toFixed(1)}${num(v.reviews)?` · ${num(v.reviews)} ביקורות`:''}`:'לא נמצא דירוג'}</span></li>
        ${num(v.myScore)?`<li><span>הציון שלנו</span><span><b>${num(v.myScore)}/10</b></span></li>`:''}
      </ul>

/* ---------- import guests from Excel / CSV ----------
   Reads every tab, finds the header row, guesses each column (remembered per header text),
   normalizes phones, and merges into the list: same phone+name → update, otherwise new. */
const IMP_FIELDS=[['','לא לייבא'],['first','שם / שם פרטי'],['last','שם משפחה'],['count','מספר מוזמנים'],['phone','טלפון'],['side','צד'],['group','קבוצה'],['inviter','מי הזמין'],['kids','ילדים'],['shuttle','הסעה'],['rsvp','אישור הגעה'],['coming','כמה מגיעים'],['note','הערות']];
const normH=s=>String(s??'').replace(/["'״׳`]/g,'').replace(/\s+/g,' ').trim();
function guessField(hd,useSaved){
  const key=normH(hd),t=key.toLowerCase();if(!t)return '';
  if(useSaved){const saved=(S.settings.importMap||{})[key];if(saved!==undefined)return saved}
  if(/טלפון|פלאפון|נייד|סלולר|phone|mobile/.test(t))return 'phone';
  if(/משפחה/.test(t)&&/שם/.test(t))return 'last';
  if(/כמה מגיעים|מאשרים|מספר מגיעים|כמות מגיעים|מגיעים בפועל/.test(t))return 'coming';
  if(/ילד/.test(t))return 'kids';
  if(/הסע/.test(t))return 'shuttle';
  if(/מי הזמין|הוזמן ע|מזמין|inviter/.test(t))return 'inviter';
  if(/מספר מוזמנים|כמות|מספר אנשים|מס אנשים|מוזמנים|count|guests/.test(t))return 'count';
  if(/^צד/.test(t)||t==='side')return 'side';
  if(/קבוצה|קטגוריה|group/.test(t))return 'group';
  if(/אישור|הגעה|סטטוס|rsvp|status/.test(t))return 'rsvp';
  if(/הער|note/.test(t))return 'note';
  if(/^שם|name/.test(t))return 'first';
  return '';
}
function normPhone(v){
  const s=String(v??'').trim();if(!s)return {phone:''};
  if(s.includes('@'))return {phone:'',warn:'בעמודת הטלפון יש כתובת מייל במקום מספר'};
  let d=s.replace(/\D/g,'');
  if(d.startsWith('00'))d=d.slice(2);
  if(d.startsWith('972'))d='0'+d.slice(3);
  else if(/^5\d{8}$/.test(d)||/^[2-9]\d{7}$/.test(d))d='0'+d;
  if(/^0\d{8,9}$/.test(d))return {phone:d};
  if(d.length>=10)return {phone:'+'+d};
  return {phone:'',warn:'מספר טלפון לא תקין'};
}
function normSide(v,def){const t=normH(v);if(!t)return def;const [n1,n2]=names();
  if(/חתן/.test(t)||t===n1||t==='a')return 'a';if(/כלה/.test(t)||t===n2||t==='b')return 'b';if(/משות/.test(t))return 'shared';return def}
function normRsvp(v){const t=normH(v).toLowerCase();if(!t)return '';
  if(/לא|^no|✗|❌/.test(t))return 'no';if(/כן|מגיע|אישר|^yes|✓|✔/.test(t))return 'yes';if(/אולי|טרם|ממתין|pending/.test(t))return 'pending';return ''}
function normShuttle(v){const t=normH(v).toLowerCase();if(!t)return '';
  if(/ירושלים|jerusalem/.test(t))return 'jlm';if(/מרכז|תל.?אביב|^תא$|center/.test(t))return 'center';if(/לא|^no/.test(t))return 'none';return ''}
const intOf=v=>{const m=String(v??'').match(/\d+/);return m?parseInt(m[0],10):null};
function sheetDefaultSide(name){const t=normH(name);const [n1,n2]=names();
  if(/חתן/.test(t)||(n1&&t.includes(n1)))return 'a';if(/כלה/.test(t)||(n2&&t.includes(n2)))return 'b';return 'shared'}

let IMP=null;
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
function openImport(){
  if(!db){toast('צריך להתחבר כדי לייבא');return}
  IMP={step:'pick'};$('#imp').hidden=false;renderImport();loadXLSX().catch(()=>{});
}
function closeImport(){if(IMP&&IMP.step==='run')return;if(IMP&&IMP.step==='q')flushQ();$('#imp').hidden=true;IMP=null}
function parseWorkbook(wb){
  const sheets=[];
  wb.SheetNames.forEach((sn,si)=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:'',raw:false,blankrows:false});
    if(!rows.length)return;
    let hr=0,best=-1;
    for(let r=0;r<Math.min(10,rows.length);r++){const sc=rows[r].filter(c=>guessField(c,false)).length;if(sc>best){best=sc;hr=r}}
    const cols=rows[hr].map((hd,c)=>({c,header:normH(hd),field:guessField(hd,true)})).filter(x=>x.header);
    sheets.push({i:si,name:sn,rows,hr,cols,include:true,side:sheetDefaultSide(sn)});
  });
  if(!sheets.length)throw new Error('empty');
  return sheets;
}
async function readImportFile(file){
  IMP={step:'loading',fileName:file.name};renderImport();
  try{
    await loadXLSX();
    const sheets=parseWorkbook(XLSX.read(await file.arrayBuffer(),{type:'array'}));
    IMP={step:'map',fileName:file.name,sheets};
  }catch(e){IMP={step:'pick',err:e&&e.message==='load'?'לא הצלחתי לטעון את רכיב קריאת האקסל. בדקו את החיבור לאינטרנט ונסו שוב.':'לא הצלחתי לקרוא את הקובץ. אפשר לייבא קובץ Excel (‎.xlsx) או CSV.'}}
  renderImport();
}
function buildPlan(sheets){
  const recs=[],warns=[];const per={};
  for(const sh of sheets){
    per[sh.i]={rows:0,people:0,skip:0};
    if(!sh.include)continue;
    const F={};sh.cols.forEach(c=>{if(c.field&&F[c.field]===undefined)F[c.field]=c.c});
    if(F.first===undefined&&F.last===undefined)continue;
    for(let r=sh.hr+1;r<sh.rows.length;r++){
      const row=sh.rows[r],get=k=>F[k]===undefined?'':String(row[F[k]]??'').trim();
      const fst=get('first'),lst=get('last');
      const name=(lst&&!fst.split(/\s+/).includes(lst)?fst+' '+lst:fst||lst).replace(/\s+/g,' ').trim();
      if(!name||/^סה.?כ/.test(name)){if(row.some(v=>String(v).trim()))per[sh.i].skip++;continue}
      const rec={name,side:normSide(get('side'),sh.side),_where:`${sh.name}, שורה ${r+1}`,_set:new Set(['name','side'])};
      const put=(k,v)=>{if(v!==''&&v!==null&&v!==undefined){rec[k]=v;rec._set.add(k)}};
      if(F.phone!==undefined){const p=normPhone(get('phone'));put('phone',p.phone);if(p.warn)warns.push(`${name} (${rec._where}): ${p.warn}`)}
      put('count',intOf(get('count')));put('kids',intOf(get('kids')));put('coming',intOf(get('coming')));
      put('group',get('group'));put('inviter',get('inviter'));put('note',get('note'));
      put('rsvp',normRsvp(get('rsvp')));put('shuttle',normShuttle(get('shuttle')));
      recs.push(rec);per[sh.i].rows++;per[sh.i].people+=rec.count||1;
    }
  }
  // the same person twice in the file (same name and phone) is imported once
  const dupNames=[],firstAt=new Map(),uniqRecs=[];
  for(const r of recs){
    const k=r.phone?r.name+'|'+r.phone:null;
    if(k&&firstAt.has(k)){dupNames.push(`${r.name} מופיע/ה פעמיים עם אותו טלפון (${firstAt.get(k)} ו-${r._where}). ייובא פעם אחת.`);continue}
    if(k)firstAt.set(k,r._where);uniqRecs.push(r);
  }
  const sameName=new Map();uniqRecs.forEach(r=>{if(!r.phone){const k=r.name+'|'+r.side;sameName.set(k,[...(sameName.get(k)||[]),r._where])}});
  sameName.forEach((w,k)=>{if(w.length>1)dupNames.push(`${k.split('|')[0]} מופיע/ה ${w.length} פעמים בלי טלפון (${w.join(', ')}). אם זה אותו אדם, כדאי למחוק שורה.`)});
  // match against the current list without creating duplicates
  const add=(m,k,g)=>m.set(k,[...(m.get(k)||[]),g]);
  const pn=new Map(),ph=new Map(),ns=new Map();
  for(const g of S.guests){const p=g.phone||'';if(p){add(pn,p+'|'+g.name,g);add(ph,p,g)}add(ns,g.name+'|'+g.side,g)}
  const filePh=new Map();uniqRecs.forEach(r=>{if(r.phone)filePh.set(r.phone,(filePh.get(r.phone)||0)+1)});
  const claimed=new Set(),news=[],ups=[];let same=0;
  const pick=arr=>(arr||[]).find(g=>!claimed.has(g.id))||null;
  for(const r of uniqRecs){
    let m=r.phone?pick(pn.get(r.phone+'|'+r.name)):null;
    if(!m&&r.phone&&(ph.get(r.phone)||[]).length===1&&filePh.get(r.phone)===1)m=pick(ph.get(r.phone));
    if(!m)m=pick(ns.get(r.name+'|'+r.side));

async function applyPlan(P,sheets,{archiveOrphans=false,onProgress=()=>{}}={}){
  const now=Date.now();
  const ops=[...P.news.map((r,i)=>['add',()=>{const d={name:r.name,side:r.side,rsvp:r.rsvp||'pending',count:r.count||1,createdAt:now+i,source:'import'};
      ['phone','group','inviter','kids','coming','shuttle','note'].forEach(k=>{if(r[k]!==undefined)d[k]=r[k]});return db.collection('guests').add(d)}]),
    ...P.ups.map(u=>['upd',()=>db.doc('guests/'+u.id).update({...u.changes,updatedAt:now})]),
    ...(archiveOrphans?P.orphans.map(g=>['arc',()=>db.doc('guests/'+g.id).update({archived:true,archivedAt:now})]):[])];
  const res={added:0,updated:0,archived:0,failed:0,done:0,total:ops.length,err:''};
  let i=0,lastErr=null;const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function worker(){while(i<ops.length){const [kind,op]=ops[i++];let tries=0;
    for(;;){try{await op();res[kind==='add'?'added':kind==='upd'?'updated':'archived']++;break}
      catch(e){if(e&&e.code==='resource_exhausted'&&tries<6){tries++;await sleep(400*2**tries);continue}res.failed++;lastErr=e;break}}
    res.done++;onProgress(res)}}
  await Promise.all([0,1,2,3].map(worker));
  const map={...(S.settings.importMap||{})};sheets.forEach(sh=>sh.cols.forEach(c=>map[c.header]=c.field));
  try{await db.doc('settings/main').update({importMap:map})}catch(_){try{await db.doc('settings/main').set({...S.settings,importMap:map})}catch(__){}}
  res.err=lastErr?errMsg(lastErr):'';

}
async function runImport(){
  const P=IMP.plan;if(!P||!db)return;
  const src=IMP;IMP={...IMP,step:'run',done:0,total:P.news.length+P.ups.length,failed:0};renderImport();
  const res=await applyPlan(P,src.sheets,{archiveOrphans:!!src.archiveOrphans,onProgress:r=>{IMP.done=r.done;IMP.total=r.total;IMP.failed=r.failed;if(r.done%5===0||r.done===r.total)renderImport()}});

  IMP={...src,step:'done',...res};renderImport();
  toast(`נוספו ${res.added}, עודכנו ${res.updated}`);
  if(res.added||res.updated)logAct(`ייבוא מוזמנים: ${res.added} חדשים, ${res.updated} עודכנו`);
}

/* ---------- Google Drive sync ----------
   Finds the newest spreadsheet in the Drive folder "מוזמנים", downloads it through the
   viewer's own Google Drive connector and runs the same import.
   "עדכון מהדרייב" shows the preview first. Daily: when the app opens, if a day has passed
   since the last check and the file changed, it applies silently with the saved choices
   (only after one manual sync, so consent and column choices already exist). */
const DRIVE='Google Drive';
const XLSX_MIME='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
let mcp=null,perms=null,driveBusy=false,autoTried=false;
const ds=()=>S.settings.driveSync||{};
const pj=r=>{let p=r&&r.payload;if(typeof p==='string'){try{p=JSON.parse(p)}catch(_){}}return p||{}};
function driveErr(e){const c=e&&e.code;
  if(c==='server_not_connected'||c==='selection_required')return 'החיבור לדרייב עוד לא הוגדר באפליקציה.';
  if(c==='needs_reauth')return 'החיבור לדרייב פג. לוחצים "עדכון מהדרייב" ומאשרים שוב.';
  if(c==='not_in_manifest'||c==='approval_required'||c==='consent_required')return 'צריך לאשר לאפליקציה גישה ל-Google Drive. לוחצים שוב על "עדכון מהדרייב" ומאשרים.';
  if(c==='server_unavailable'||c==='upstream_error')return 'Google Drive לא ענה כרגע. נסו שוב בעוד כמה דקות.';
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return 'צריך להתחבר כדי לעדכן מהדרייב.';
  if(e&&e.message==='nofile')return 'לא מצאתי קובץ אקסל או גיליון בתיקייה "מוזמנים" בדרייב.';
  if(e&&e.message==='nobytes')return 'הקובץ הורד, אבל לא בפורמט שאפשר לקרוא.';
  if(e&&e.message==='empty')return 'הקובץ בדרייב ריק או בלי שורת כותרות.';
  if(c==='tool_error')return 'הדרייב החזיר שגיאה: '+String(e.message||'').slice(0,120);

async function driveFolder(){
  if(S.settings.driveFolderId)return S.settings.driveFolderId;
  const r=await mcp.callTool(DRIVE,'search_files',{query:"title = 'מוזמנים' and mimeType = 'application/vnd.google-apps.folder' and trashed = false",excludeContentSnippets:true,pageSize:5},{cache:false});

}
async function driveLatest(){
  const folder=String(await driveFolder()).replace(/[^\w-]/g,'');
  const q=`parentId = '${folder}' and trashed = false and (mimeType = 'application/vnd.google-apps.spreadsheet' or mimeType contains 'spreadsheetml' or mimeType = 'application/vnd.ms-excel' or mimeType = 'text/csv')`;
  const r=await mcp.callTool(DRIVE,'search_files',{query:q,excludeContentSnippets:true,orderBy:'modifiedTime desc',pageSize:5},{cache:false});
  const files=pj(r).files||[];if(!files.length)throw new Error('nofile');return files[0];
}
function b64of(r){const p=pj(r);let b=p.content||p.data||p.contentBase64||p.base64;

  catch(e){if(!isG||e.code!=='tool_error')throw e;got=b64of(await mcp.callTool(DRIVE,'download_file_content',{fileId:f.id},{cache:false}));got.csvOnly=true}

function applySheetCfg(sheets){const cfg=ds().sheets||{};sheets.forEach(sh=>{const c=cfg[sh.name];if(c){sh.include=c.include!==false;if(c.side)sh.side=c.side}});return sheets}
async function markDriveSync(drive,res,sheets){

}
async function driveManual(){
  if(driveBusy)return;
  if(!mcp){toast(driveErr({code:'not_granted'}));return}
  driveBusy=true;IMP={step:'loading',fileName:'Google Drive'};$('#imp').hidden=false;renderImport();
  try{const f=await driveLatest();IMP.fileName=f.title;renderImport();
    const sheets=applySheetCfg(await driveDownload(f));

  }catch(e){IMP={step:'pick',err:driveErr(e)}}

async function driveAuto(){
  const d=ds();if(!mcp||!db||!canWrite||!d.lastAt||driveBusy)return;
  if(Date.now()-d.lastAt<20*3600e3)return;
  if(d.runningAt&&Date.now()-d.runningAt<5*60e3)return;
  if(perms){const st=await perms.state('mcp:'+DRIVE).catch(()=>'unavailable');if(st!=='granted')return}
  driveBusy=true;
  try{
    const f=await driveLatest();
    if(f.id===d.fileId&&f.modifiedTime===d.modified){await db.doc('settings/main').update({driveSync:{...ds(),lastAt:Date.now(),lastError:''}});return}
    await db.doc('settings/main').update({driveSync:{...ds(),runningAt:Date.now()}});
    const sheets=applySheetCfg(await driveDownload(f));
    const P=buildPlan(sheets);
    const res=await applyPlan(P,sheets,{});
    if(res.failed)throw {message:res.err||'failed'};
    await markDriveSync({fileId:f.id,title:f.title,modified:f.modifiedTime},res,null);
    if(res.added||res.updated){toast(`עודכן מהדרייב: ${res.added} חדשים, ${res.updated} עודכנו`);logAct(`עדכון מהדרייב: ${res.added} חדשים, ${res.updated} עודכנו`)}
  }catch(e){try{await db.doc('settings/main').update({driveSync:{...ds(),runningAt:0,lastError:driveErr(e),lastErrorAt:Date.now()}})}catch(_){}}
  finally{driveBusy=false}
}
function driveLine(){

function openBackup(){

    <label class="btn" style="cursor:pointer">שחזור מקובץ<input id="bkFile" type="file" accept="application/json,.json" hidden></label>
    <button type="button" class="btn ghost" data-iclose="1">סגירה</button></div>
    <p id="bkMsg" class="hint" style="margin:0" role="status"></p>`;

function backupData(){
  const out={app:'wedding',version:1,exportedAt:new Date().toISOString(),collections:{}};
  out.collections.settings={main:{...S.settings}};
  COLLS.filter(c=>c!=='settings').forEach(c=>{const m={};[...S[c],...(ARCH[c]||[])].forEach(x=>{const {id,...rest}=x;m[id]=rest});out.collections[c]=m});
  return out;
}
async function restoreBackup(file){
  const msg=$('#bkMsg');const show=t=>{if(msg)msg.textContent=t};
  let data;try{data=JSON.parse(await file.text())}catch(_){show('הקובץ לא נקרא. בחרו קובץ גיבוי של האפליקציה.');return}
  const cols=data&&data.collections;if(!cols||typeof cols!=='object'){show('זה לא קובץ גיבוי של האפליקציה.');return}
  const jobs=[];
  for(const [c,docs] of Object.entries(cols)){if(!COLLS.includes(c)||!docs||typeof docs!=='object')continue;for(const [id,d] of Object.entries(docs)){if(/^[\w-]{1,200}$/.test(id)&&d&&typeof d==='object')jobs.push([c,id,d])}}
  if(!jobs.length){show('אין בקובץ נתונים לשחזר.');return}
  let done=0,failed=0,next=0;
  const worker=async()=>{while(next<jobs.length){const [c,id,d]=jobs[next++];
    try{await (c==='settings'?db.doc('settings/'+id):db.collection(c).doc(id)).set(d)}catch(e){failed++}
    done++;if(done%20===0)show(`משחזר… ${done} מתוך ${jobs.length}`)}};
  show(`משחזר… 0 מתוך ${jobs.length}`);
  await Promise.all([worker(),worker(),worker(),worker()]);
  show(failed?`שוחזרו ${done-failed} פריטים, ${failed} נכשלו. אפשר להריץ שוב את אותו קובץ.`:`שוחזרו ${done} פריטים.`);
}
$('#imp').addEventListener('click',e=>{
  const b=e.target.closest('[data-bk="export"]');if(!b)return;
  const blob=new Blob([JSON.stringify(backupData(),null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`wedding-backup-${isoD(today())}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  const m=$('#bkMsg');if(m)m.textContent='הקובץ ירד. כדאי לשמור אותו בדרייב.';
});
$('#imp').addEventListener('change',e=>{if(e.target.id==='bkFile'&&e.target.files[0]){if(!db){toast('צריך להתחבר');return}restoreBackup(e.target.files[0]);e.target.value=''}});
document.addEventListener('wedding:user',e=>{const d=e.detail||{};const el=$('#meLine');if(el)el.textContent=d.email?`מחובר/ת: ${d.name||d.email}`:''});

/* ---------- data ---------- */
/* coalesce bursts of snapshot updates (e.g. during an import) into one render;
   keep the search box focused while the guest list redraws */
let rq=0;
function queueRender(){if(rq)return;rq=setTimeout(()=>{rq=0;const a=document.activeElement,id=a&&a.id,pos=a&&a.selectionStart;render();if(id){const el=document.getElementById(id);if(el&&el!==a){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}},60)}
function notice(t){const n=$('#notice');if(t){n.textContent=t;n.hidden=false}else n.hidden=true}
function watch(key){
  const t=setTimeout(()=>{if(!loaded[key])notice('הנתונים עדיין לא נטענו. בדקו את החיבור לאינטרנט – הם יופיעו ברגע שהחיבור יחזור.')},10000);
  const onErr=()=>{clearTimeout(t);notice('לא ניתן לטעון חלק מהנתונים כרגע. רעננו את העמוד מאוחר יותר.')};
  const done=meta=>{if(!meta.fromCache){clearTimeout(t);loaded[key]=true;if(COLLS.every(k=>loaded[k])){notice('');if(!autoTried){autoTried=true;setTimeout(()=>driveAuto().then(()=>queueRender()),1500)}}}};
  if(key==='settings')db.doc('settings/main').onSnapshot(d=>{S.settings=d.exists?{...d.data()}:{};seen[key]=true;done(d.metadata);queueRender()},onErr);
  else db.collection(key).onSnapshot(s=>{const all=s.docs.map(d=>({id:d.id,...d.data()}));S[key]=all.filter(x=>!x.archived);ARCH[key]=all.filter(x=>x.archived);if(!s.metadata.fromCache||s.size)seen[key]=true;done(s.metadata);queueRender()},e=>{seen[key]=true;onErr(e);queueRender()});
}

render();
(async()=>{
  try{
    const c=window.claude;
    if(!c||!c.use){dbState='none';notice('לא הצלחנו לטעון את האפליקציה. רעננו את העמוד.');canWrite=false;render();return}
    const [d,u]=await Promise.all([c.use('db'),c.use('user')]);
    db=d;
    if(!db){dbState='none';canWrite=false;notice('לא הצלחנו להתחבר לנתונים. בדקו את החיבור לאינטרנט ורעננו.');render();return}
    dbState='ready';
    if(u){const cw=await u.can('data.write');if(cw===false)canWrite=false}
    c.use('assets').then(a=>{assets=a;if(!$('#sheet').hidden)renderFiles()}).catch(()=>{});
    c.use('permissions').then(p=>{perms=p}).catch(()=>{});
    c.use('mcp').then(m=>{mcp=m;if(m){queueRender();if(autoTried)driveAuto().then(()=>queueRender())}}).catch(()=>{});
    render();
    COLLS.forEach(watch);
  }catch(e){dbState='none';canWrite=false;notice('לא הצלחנו להתחבר לאחסון הנתונים.');render()}
})();
})();
</script>
<script>
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
